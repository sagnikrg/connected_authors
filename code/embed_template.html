<title>Connected Authors: Sagnik Edition (embed)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: plot area only, filling the whole frame (website embed); data is a frozen snapshot embedded below */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#dfe3e9;
  --node:#2f5d8a; --node-hi:#c4572e; --edge:#8a95a3; --graph-bg:#fbfcfd;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --fg:#e6ebf1; --muted:#9aa5b3; --line:#2c3440;
  --node:#7fb0e0; --node-hi:#f0a07c; --edge:#6b7685; --graph-bg:#151a21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2029; --fg:#e6ebf1; --muted:#9aa5b3; --line:#2c3440;
  --node:#7fb0e0; --node-hi:#f0a07c; --edge:#6b7685; --graph-bg:#151a21; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0;max-width:70ch}
.graphbox{display:grid;grid-template-columns:minmax(0,1fr) 270px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--graph-bg)}
@media (max-width:760px){.graphbox{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;height:clamp(420px,74vh,780px);min-width:0}
.stage svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.stage svg:active{cursor:grabbing}
.gtools{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gbtn{all:unset;box-sizing:border-box;cursor:pointer;font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.gbtn:hover{border-color:var(--fg)}
.gbtn:focus-visible{outline:2px solid var(--node);outline-offset:2px}
.gbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.find{font:inherit;font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:180px;min-width:0}
.find:focus-visible{outline:2px solid var(--node);outline-offset:1px}
.legend{position:absolute;left:10px;bottom:10px;font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;max-width:calc(100% - 20px)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.12);max-width:240px}
.panel{border-left:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:auto;max-height:clamp(420px,74vh,780px)}
@media (max-width:760px){.panel{border-left:0;border-top:1px solid var(--line);max-height:none}}
.panel h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
.meta{font-size:.82rem;color:var(--muted);margin:0}
.panel ol{margin:0;padding-left:1.2em;font-size:.85rem;display:flex;flex-direction:column;gap:2px}
.panel ol button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.panel ol button:hover{text-decoration-color:var(--fg)}
.w{font-variant-numeric:tabular-nums;color:var(--muted)}
.node{cursor:pointer}
.node text{font-family:var(--body);font-size:10px;fill:var(--fg);paint-order:stroke;stroke:var(--graph-bg);stroke-width:3px;pointer-events:none}
.foot{font-size:.78rem;color:var(--muted)}
.hit{cursor:pointer}
.plist{list-style:none;margin:0;padding:0;font-size:.82rem;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;flex-direction:column;gap:1px;min-width:0;overflow-wrap:anywhere}
.plist a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.plist a:hover{text-decoration-color:var(--fg)}
.plist .pm{color:var(--muted);font-size:.74rem}
.panel ol .go{all:unset;cursor:pointer;margin-left:6px;font-size:.78rem;color:var(--muted)}
.panel ol .go:hover{color:var(--fg)}
details.pl summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
.prow{display:flex;gap:6px;flex-wrap:wrap}
.ramp{display:inline-block;width:60px;height:9px;border-radius:5px;vertical-align:middle;margin:0 4px;background:linear-gradient(90deg,color-mix(in srgb,var(--node) 18%,var(--graph-bg)),var(--node))}
html,body{height:100%;overflow:hidden}
/* embed: the detail panel floats over the plot, only while something is selected */
.panel{position:absolute;right:10px;top:46px;bottom:10px;width:min(290px,46%);max-height:none!important;border:1px solid var(--line)!important;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);z-index:3}
.panel[data-empty="1"]{display:none}
body{padding:0!important}
.stage{height:100%!important;width:100%;background:var(--graph-bg)}

/* topic chips (paper lists only) */
:root{--t-dtc:#b5482a; --t-mbleth:#3b6fb6; --t-experiment:#8a6500; --t-majorana:#7b4bb0; --t-pisg:#a8336b; --t-scar:#2e7d4f; --t-sff:#5f6b7a;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-dtc:#f0a07c; --t-mbleth:#8cb4ea; --t-experiment:#e0c060; --t-majorana:#c3a2ec; --t-pisg:#ec9cc4; --t-scar:#86d3a5; --t-sff:#b4bfcc;}}
:root[data-theme="dark"]{--t-dtc:#f0a07c; --t-mbleth:#8cb4ea; --t-experiment:#e0c060; --t-majorana:#c3a2ec; --t-pisg:#ec9cc4; --t-scar:#86d3a5; --t-sff:#b4bfcc;}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.68rem;font-weight:600;line-height:1.35;padding:0 6px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
</style>

<div class="stage" id="stage">
      <svg id="svg" role="img" aria-label="Co-author graph of the authors in my paper collection"></svg>
      <div class="gtools">
        <input class="find" id="find" list="names" type="search" placeholder="Find someone…" aria-label="Find someone and centre the graph on them">
        <datalist id="names"></datalist>
        <button class="gbtn" id="only" type="button" aria-pressed="false" title="When someone is selected, hide everyone who is not their co-author">Only their cluster</button>
        <button class="gbtn" id="lonely" type="button" aria-pressed="false">Hide unlinked</button>
        <button class="gbtn" id="labels" type="button" aria-pressed="false">All names</button>
        <button class="gbtn" id="recency" type="button" aria-pressed="true" title="Shade bubbles by their most recent paper on my shelf, lines by the most recent paper the two share (log scale)">Recency shade</button>
        <button class="gbtn" id="reset" type="button">Reset view</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
<aside class="panel" id="panel" aria-live="polite"></aside>
<p class="foot" id="foot" hidden></p>

<script>
const DATA=/*DATA*/null;
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NAME=Object.fromEntries(DATA.people.map(p=>[p.id,p.name]));
const P=Object.fromEntries(DATA.people.map(p=>[p.id,p.papers]));
const rad=p=>4+3.2*Math.sqrt(p);
let G=null, sel=null, selPair=null, recency=true, hideLonely=false, allLabels=false, onlyCluster=false;
/* papers + recency: freshness 1 for this year, falling like log(1+age), so 30 vs 35 years ago look alike but this year vs two years ago do not */
const PAP=DATA.list||[];
const NOW=new Date().getFullYear();
const AMAX=(()=>{const ys=PAP.map(p=>+p.y).filter(Boolean);return ys.length?Math.max(10,NOW-Math.min(...ys)):40;})();
const papersOf=id=>PAP.filter(p=>p.a.includes(id));
const papersOfPair=(a,b)=>PAP.filter(p=>p.a.includes(a)&&p.a.includes(b));
const lastYear=list=>{const ys=list.map(p=>+p.y).filter(Boolean);return ys.length?Math.max(...ys):null;};
const byYear=(x,y)=>(+y.y||0)-(+x.y||0)||x.t.localeCompare(y.t);
const freshness=y=>y==null?null:1-Math.log1p(Math.max(0,NOW-y))/Math.log1p(AMAX);
function fillOf(d){const c=css("--node");if(!recency||!PAP.length)return c;const f=freshness(d.my);return f==null?c:d3.interpolateRgb(css("--graph-bg"),c)(0.18+0.82*f);}
function edgeCol(d){const c=css("--edge");if(!recency||!PAP.length||d.ly==null)return c;return d3.interpolateRgb(css("--graph-bg"),css("--fg"))(0.12+0.78*freshness(d.ly));}
const edgeOp=d=>recency&&PAP.length&&d.ly!=null?0.75:0.45;
const NB={}; for(const [a,b,w] of DATA.edges){(NB[a]=NB[a]||[]).push([b,w]);(NB[b]=NB[b]||[]).push([a,w]);}
for(const k in NB) NB[k].sort((x,y)=>y[1]-x[1]);
const neighbours=id=>NB[id]||[];
const rm=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

function build(){
  const prev=G?Object.fromEntries(G.nodes.map(n=>[n.id,n])):{};
  const nodes=DATA.people.filter(p=>p.papers>0&&(!hideLonely||NB[p.id])).map(p=>{const o=prev[p.id]||{};return {id:p.id,name:p.name,p:p.papers,my:lastYear(papersOf(p.id)),x:o.x,y:o.y,vx:o.vx,vy:o.vy};});
  const ids=new Set(nodes.map(n=>n.id));
  const links=DATA.edges.filter(([a,b])=>ids.has(a)&&ids.has(b)).map(([a,b,w])=>({source:a,target:b,w,ly:lastYear(papersOfPair(a,b))}));
  const svg=d3.select("#svg"); svg.selectAll("*").remove();
  const box=$("stage").getBoundingClientRect(); svg.attr("viewBox",[-box.width/2,-box.height/2,box.width,box.height]);
  const g=svg.append("g");
  const link=g.append("g").attr("stroke-linecap","round").selectAll("line").data(links).join("line")
    .attr("stroke",d=>edgeCol(d)).attr("stroke-width",d=>0.8+1.6*d.w).attr("stroke-opacity",d=>edgeOp(d));
  const hit=g.append("g").attr("stroke","transparent").selectAll("line").data(links).join("line").attr("class","hit")
    .attr("stroke-width",d=>Math.max(12,4+1.6*d.w))
    .on("click",(e,d)=>{e.stopPropagation();selectPair(d.source.id,d.target.id);})
    .on("mouseenter",tipLink).on("mousemove",tipLink).on("mouseleave",()=>{$("tip").hidden=true;});
  const node=g.append("g").selectAll("g").data(nodes,d=>d.id).join("g").attr("class","node");
  node.append("circle").attr("r",d=>rad(d.p)).attr("fill",css("--node")).attr("stroke",css("--graph-bg")).attr("stroke-width",1.5);
  node.append("text").attr("dy",d=>-rad(d.p)-4).attr("text-anchor","middle").text(d=>d.name);
  const sim=d3.forceSimulation(nodes)
    .force("link",d3.forceLink(links).id(d=>d.id).distance(d=>rad(d.source.p)+rad(d.target.p)+150/Math.sqrt(d.w)).strength(d=>Math.min(0.8,0.15+0.08*d.w)))
    .force("charge",d3.forceManyBody().strength(d=>-180-60*Math.sqrt(d.p)).distanceMax(600))
    .force("collide",d3.forceCollide(d=>rad(d.p)+10))
    .force("x",d3.forceX(0).strength(0.025)).force("y",d3.forceY(0).strength(0.035))
    .on("tick",()=>{hit.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
                    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
                    node.attr("transform",d=>`translate(${d.x},${d.y})`);});
  const fresh=!Object.keys(prev).length; if(!fresh) sim.alpha(0.5);
  if(rm()){sim.stop();for(let i=0;i<300;i++)sim.tick();sim.on("tick")();}
  const zoom=d3.zoom().scaleExtent([0.15,5]).on("zoom",e=>{g.attr("transform",e.transform);if(G){G.k=e.transform.k;labels();}});
  svg.call(zoom).on("dblclick.zoom",null);
  svg.on("click",e=>{if(e.target===svg.node())select(null);});
  node.call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.25).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  node.on("click",(e,d)=>{e.stopPropagation();select(d.id);})
    .on("mouseenter",tip).on("mousemove",tip).on("mouseleave",()=>{$("tip").hidden=true;});
  G={sim,node,link,nodes,links,zoom,svg,g,k:1};
  const k0=fresh?Math.min(1,Math.sqrt(40/Math.max(nodes.length,1))+0.25):d3.zoomTransform(svg.node()).k;
  svg.call(zoom.transform,fresh?d3.zoomIdentity.scale(k0):d3.zoomTransform(svg.node()));
  highlight(); panel();
}
function labels(){
  if(!G)return;
  const nb=sel?new Set([sel,...neighbours(sel).map(x=>x[0])]):null;
  G.node.select("text").attr("display",d=>nb?(nb.has(d.id)?null:"none"):(allLabels||d.p>=6||(G.k>1.6&&d.p>=2)||G.k>2.6?null:"none"));
}
function highlight(){
  if(!G)return;
  G.node.select("circle").attr("fill",d=>d.id===sel?css("--node-hi"):fillOf(d));
  $("rl").hidden=!(recency&&PAP.length);
  if(selPair){
    const [a,b]=selPair, on=d=>(d.source.id===a&&d.target.id===b)||(d.source.id===b&&d.target.id===a);
    G.node.attr("display",null).attr("opacity",d=>d.id===a||d.id===b?1:0.15);
    G.link.attr("display",null).attr("stroke-opacity",d=>on(d)?0.95:0.05).attr("stroke",d=>on(d)?css("--fg"):edgeCol(d));
    G.node.select("text").attr("display",d=>d.id===a||d.id===b?null:"none");
    return;
  }
  if(!sel){G.node.attr("opacity",1).attr("display",null);G.link.attr("display",null).attr("stroke-opacity",d=>edgeOp(d)).attr("stroke",d=>edgeCol(d));labels();return;}
  const nb=new Set([sel,...neighbours(sel).map(x=>x[0])]);
  const touches=d=>d.source.id===sel||d.target.id===sel;
  if(onlyCluster){
    G.node.attr("display",d=>nb.has(d.id)?null:"none").attr("opacity",1);
    G.link.attr("display",d=>nb.has(d.source.id)&&nb.has(d.target.id)?null:"none").attr("stroke-opacity",d=>touches(d)?0.9:0.35).attr("stroke",d=>touches(d)?css("--fg"):edgeCol(d));
  } else {
    G.node.attr("display",null).attr("opacity",d=>nb.has(d.id)?1:0.15);
    G.link.attr("display",null).attr("stroke-opacity",d=>touches(d)?0.9:0.05).attr("stroke",d=>touches(d)?css("--fg"):edgeCol(d));
  }
  labels();
}
function tip(e,d){
  const t=$("tip"), s=$("stage").getBoundingClientRect(), nb=neighbours(d.id);
  t.replaceChildren(Object.assign(document.createElement("b"),{textContent:d.name}),
    Object.assign(document.createElement("div"),{textContent:`${d.p} paper${d.p===1?"":"s"} on my shelf · ${nb.length} co-author${nb.length===1?"":"s"} here`+(d.my?` · latest ${d.my}`:"")}));
  if(nb.length){const m=document.createElement("div");m.style.color="var(--muted)";m.textContent="Most with "+nb.slice(0,3).map(([id,w])=>NAME[id]+" ("+w+")").join(", ");t.append(m);}
  t.hidden=false;
  let x=e.clientX-s.left+12,y=e.clientY-s.top+12;
  if(x+250>s.width)x=e.clientX-s.left-250; if(y+90>s.height)y=e.clientY-s.top-90;
  t.style.left=Math.max(4,x)+"px"; t.style.top=Math.max(4,y)+"px";
}
function tipLink(e,d){
  const t=$("tip"), s=$("stage").getBoundingClientRect();
  t.replaceChildren(Object.assign(document.createElement("b"),{textContent:NAME[d.source.id]+" & "+NAME[d.target.id]}),
    Object.assign(document.createElement("div"),{textContent:`${d.w} paper${d.w===1?"":"s"} together${d.ly?" · latest "+d.ly:""} · click for the list`}));
  t.hidden=false;
  let x=e.clientX-s.left+12,y=e.clientY-s.top+12;
  if(x+250>s.width)x=e.clientX-s.left-250; if(y+70>s.height)y=e.clientY-s.top-70;
  t.style.left=Math.max(4,x)+"px"; t.style.top=Math.max(4,y)+"px";
}

const TOPICS=["dtc","pi-SG","mbl-eth","scar","majorana","SFF","experiment"];
function chips(k){const s=document.createElement("span");s.className="chips";
  for(const t of TOPICS.filter(x=>(k||[]).includes(x))){const c=document.createElement("span");c.className="chip";c.textContent=t;c.style.setProperty("--c","var(--t-"+t.replace("-","").toLowerCase()+")");s.append(c);}
  return s;}
function paperList(list){
  const ul=document.createElement("ul"); ul.className="plist";
  for(const p of list.slice().sort(byYear)){
    const li=document.createElement("li"); let a;
    if(p.u){a=document.createElement("a");a.href=p.u;a.target="_blank";a.rel="noopener";a.title=p.u.includes("arxiv")?"arXiv":"Journal";}
    else a=document.createElement("span");
    a.textContent=p.t; li.append(a);
    const m=document.createElement("span"); m.className="pm"; m.textContent=[p.y,p.u?(p.u.includes("arxiv")?"arXiv":"journal"):""].filter(Boolean).join(" · ");
    if(m.textContent||(p.k&&p.k.length)){const row=document.createElement("span");row.className="pm";row.style.display="flex";row.style.gap="6px";row.style.flexWrap="wrap";row.style.alignItems="center";
      if(m.textContent) row.append(m); if(p.k&&p.k.length) row.append(chips(p.k)); li.append(row);}
    ul.append(li);
  }
  return ul;
}
function clearBtn(){const b=document.createElement("button");b.type="button";b.className="gbtn";b.textContent="Clear";b.addEventListener("click",()=>select(null));return b;}
function panel(){
  const el=$("panel"); el.replaceChildren(); el.dataset.empty=sel||selPair?"0":"1";
  if(selPair){
    const [a,b]=selPair, list=papersOfPair(a,b), ly=lastYear(list);
    el.append(Object.assign(document.createElement("h3"),{textContent:NAME[a]+" & "+NAME[b]}),
      Object.assign(document.createElement("p"),{className:"meta",textContent:`${list.length} paper${list.length===1?"":"s"} together on my shelf${ly?" · latest "+ly:""}`}),
      paperList(list));
    const row=document.createElement("div"); row.className="prow";
    for(const id of [a,b]){const x=document.createElement("button");x.type="button";x.className="gbtn";x.textContent="→ "+NAME[id];x.addEventListener("click",()=>centreOn(id));row.append(x);}
    row.append(clearBtn()); el.append(row);
    return;
  }
  if(!sel){
    el.append(Object.assign(document.createElement("h3"),{textContent:"Pick someone"}),
      Object.assign(document.createElement("p"),{className:"meta",textContent:`${G?G.nodes.length:0} people, ${G?G.links.length:0} co-author links.`}),
      Object.assign(document.createElement("p"),{className:"meta",textContent:"Click a bubble or type a name to see who they wrote with, click a line for the papers the two share. Drag bubbles, scroll or pinch to zoom, click empty space to clear."}));
    return;
  }
  const nb=neighbours(sel);
  el.append(Object.assign(document.createElement("h3"),{textContent:NAME[sel]}),
    Object.assign(document.createElement("p"),{className:"meta",textContent:`${P[sel]} paper${P[sel]===1?"":"s"} on my shelf`+(lastYear(papersOf(sel))?" · latest "+lastYear(papersOf(sel)):"")}));
  if(nb.length){
    el.append(Object.assign(document.createElement("p"),{className:"meta",textContent:"Co-authors here (papers together). Click a name for the shared papers, → to go to them:"}));
    const ol=document.createElement("ol");
    for(const [id,w] of nb){const li=document.createElement("li");const b=document.createElement("button");b.type="button";b.textContent=NAME[id];
      b.title="Show the papers they wrote together"; b.addEventListener("click",()=>selectPair(sel,id));
      const go=document.createElement("button");go.type="button";go.className="go";go.textContent="→";go.title="Go to "+NAME[id];go.setAttribute("aria-label","Go to "+NAME[id]);go.addEventListener("click",()=>centreOn(id));
      li.append(b,Object.assign(document.createElement("span"),{className:"w",textContent:" "+w}),go);ol.append(li);}
    el.append(ol);
  } else el.append(Object.assign(document.createElement("p"),{className:"meta",textContent:"No co-authored papers with anyone else here."}));
  const mine=papersOf(sel);
  if(mine.length){const dt=document.createElement("details");dt.className="pl";dt.append(Object.assign(document.createElement("summary"),{textContent:`Their papers (${mine.length})`}),paperList(mine));el.append(dt);}
  const row=document.createElement("div"); row.className="prow"; row.append(clearBtn()); el.append(row);
}
function select(id){sel=id;selPair=null;highlight();panel();}
function selectPair(a,b){sel=null;selPair=[a,b];highlight();panel();}
function centreOn(id,tries=0){
  if(!G)return;
  const n=G.nodes.find(x=>x.id===id);
  if(!n){ if(tries===0&&hideLonely){hideLonely=false;$("lonely").setAttribute("aria-pressed","false");build();setTimeout(()=>centreOn(id,1),400);} return; }
  select(id);
  const k=Math.max(d3.zoomTransform(G.svg.node()).k,1.3), t=d3.zoomIdentity.scale(k).translate(-n.x,-n.y);
  (rm()?G.svg:G.svg.transition().duration(600)).call(G.zoom.transform,t);
}
function findGo(){
  const v=$("find").value.trim().toLowerCase(); if(!v)return;
  const hit=DATA.people.find(p=>p.name.toLowerCase()===v&&p.papers>0)||DATA.people.find(p=>p.name.toLowerCase().includes(v)&&p.papers>0);
  if(hit) centreOn(hit.id);
}
$("names").replaceChildren(...DATA.people.filter(p=>p.papers>0).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>Object.assign(document.createElement("option"),{value:p.name})));
$("find").addEventListener("change",findGo);
$("find").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();findGo();}});
$("only").addEventListener("click",e=>{onlyCluster=!onlyCluster;e.currentTarget.setAttribute("aria-pressed",String(onlyCluster));highlight();});
$("lonely").addEventListener("click",e=>{hideLonely=!hideLonely;e.currentTarget.setAttribute("aria-pressed",String(hideLonely));if(sel&&!NB[sel])sel=null;build();});
$("recency").addEventListener("click",e=>{recency=!recency;e.currentTarget.setAttribute("aria-pressed",String(recency));highlight();});
$("labels").addEventListener("click",e=>{allLabels=!allLabels;e.currentTarget.setAttribute("aria-pressed",String(allLabels));labels();});
$("reset").addEventListener("click",()=>{if(G)G.svg.transition().duration(300).call(G.zoom.transform,d3.zoomIdentity);select(null);});
let rsz; addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(G){const b=$("stage").getBoundingClientRect();G.svg.attr("viewBox",[-b.width/2,-b.height/2,b.width,b.height]);}},150);});
$("legend").innerHTML='Bubble size: papers on my shelf · line thickness: papers they wrote together<span id="rl"> · shade: older<i class="ramp"></i>'+NOW+"</span>";
$("foot").textContent=`Snapshot of ${DATA.papers} PDFs, ${DATA.built}. Counted from my own collection, so it says what I read, not who is most important.`;
if(window.d3) build(); else $("panel").textContent="The graph library did not load. Reload the page.";
</script>
